name: Desktop Release

on:
  push:
    tags:
      - desktop-v*

permissions:
  contents: read

concurrency:
  group: synai-desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            artifact: macos-arm64
            artifact_platform: macos
            rust_target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin --config src-tauri/tauri.release.conf.json
          - runner: macos-latest
            artifact: macos-x64
            artifact_platform: macos
            rust_target: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin --config src-tauri/tauri.release.conf.json
          - runner: ubuntu-22.04
            artifact: linux-x64
            artifact_platform: linux
            rust_target: x86_64-unknown-linux-gnu
            tauri_args: --bundles appimage,deb --config src-tauri/tauri.linux.release.conf.json
          - runner: windows-latest
            artifact: windows-x64
            artifact_platform: windows
            rust_target: x86_64-pc-windows-msvc
            tauri_args: --bundles nsis --config src-tauri/tauri.windows.ci.conf.json
    defaults:
      run:
        working-directory: packages/desktop-app/apps/examples/desktop-app
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libappindicator3-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            wget \
            xdg-utils

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop-app/apps/examples/desktop-app/src-tauri -> target

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
        working-directory: packages/desktop-app

      - name: Build shared desktop package
        run: bun bun.mts
        working-directory: packages/desktop-app/sdk/packages/shared
        env:
          BUILD_MODE: package

      - name: Build LLM desktop package
        run: bun run build
        working-directory: packages/desktop-app/sdk/packages/llms

      - name: Build agents desktop package
        run: bun run build
        working-directory: packages/desktop-app/sdk/packages/agents

      - name: Build core desktop package
        run: bun run build
        working-directory: packages/desktop-app/sdk/packages/core

      - name: Verify release tag and app versions
        run: |
          bun -e 'const pkg = await Bun.file("package.json").json(); const tauri = await Bun.file("src-tauri/tauri.conf.json").json(); if (pkg.version !== tauri.version) throw new Error("package.json (" + pkg.version + ") and Tauri (" + tauri.version + ") versions differ"); if (process.env.GITHUB_REF_NAME !== "desktop-v" + pkg.version) throw new Error("tag " + process.env.GITHUB_REF_NAME + " must match desktop-v" + pkg.version); console.log("Building SynAI desktop " + pkg.version)'

      - name: Check signing credentials
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ matrix.artifact_platform != 'linux' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ matrix.artifact_platform != 'linux' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          APPLE_CERTIFICATE: ${{ matrix.artifact_platform == 'macos' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.artifact_platform == 'macos' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.artifact_platform == 'macos' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY_P8_BASE64: ${{ matrix.artifact_platform == 'macos' && secrets.APPLE_API_KEY_P8_BASE64 || '' }}
          APPLE_API_KEY_ID: ${{ matrix.artifact_platform == 'macos' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.artifact_platform == 'macos' && secrets.APPLE_API_ISSUER || '' }}
          AZURE_CLIENT_ID: ${{ matrix.artifact_platform == 'windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_TENANT_ID: ${{ matrix.artifact_platform == 'windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_SUBSCRIPTION_ID: ${{ matrix.artifact_platform == 'windows' && secrets.AZURE_SUBSCRIPTION_ID || '' }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ matrix.artifact_platform == 'windows' && secrets.AZURE_TRUSTED_SIGNING_ENDPOINT || '' }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ matrix.artifact_platform == 'windows' && secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME || '' }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ matrix.artifact_platform == 'windows' && secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE || '' }}
        run: |
          required=""
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            required="TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            required="TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_TRUSTED_SIGNING_ENDPOINT AZURE_TRUSTED_SIGNING_ACCOUNT_NAME AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE"
          fi
          for name in $required; do
            if [[ -z "$(printenv "$name")" ]]; then
              echo "::error::Missing required release secret: $name"
              exit 1
            fi
          done

      - name: Configure Apple notarization key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | openssl base64 -d -A > "$key_path"
          {
            echo "APPLE_API_KEY=$APPLE_API_KEY_ID"
            echo "APPLE_API_KEY_PATH=$key_path"
          } >> "$GITHUB_ENV"

      - name: Set up Java for Windows signing
        if: runner.os == 'Windows'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Sign in to Azure Trusted Signing
        if: runner.os == 'Windows'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare Windows signing configuration
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-windows-release-config.ps1

      - name: Build desktop installers
        run: bunx tauri build ${{ matrix.tauri_args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ matrix.artifact_platform != 'linux' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ matrix.artifact_platform != 'linux' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          APPLE_CERTIFICATE: ${{ matrix.artifact_platform == 'macos' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.artifact_platform == 'macos' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.artifact_platform == 'macos' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ matrix.artifact_platform == 'macos' && secrets.APPLE_API_ISSUER || '' }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ matrix.artifact_platform == 'windows' && secrets.AZURE_TRUSTED_SIGNING_ENDPOINT || '' }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ matrix.artifact_platform == 'windows' && secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME || '' }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ matrix.artifact_platform == 'windows' && secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE || '' }}

      - name: Collect release assets
        run: bun run scripts/collect-desktop-release-artifacts.ts ${{ matrix.artifact_platform }} ${{ matrix.rust_target }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synai-desktop-${{ matrix.artifact }}
          path: packages/desktop-app/apps/examples/desktop-app/dist/desktop-release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release scripts
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Download platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: synai-desktop-*
          path: ${{ runner.temp }}/synai-desktop-release
          merge-multiple: true

      - name: Validate installers and prepare updater manifest
        shell: bash
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/synai-desktop-release"
          dmg_count="$(find "$assets" -maxdepth 1 -type f -iname '*.dmg' | wc -l)"
          appimage_count="$(find "$assets" -maxdepth 1 -type f -iname '*.appimage' | wc -l)"
          deb_count="$(find "$assets" -maxdepth 1 -type f -iname '*.deb' | wc -l)"
          if [[ "$dmg_count" -lt 2 ]]; then
            echo "::error::Expected both Apple Silicon and Intel macOS DMG installers."
            exit 1
          fi
          if [[ "$appimage_count" -lt 1 || "$deb_count" -lt 1 ]]; then
            echo "::error::Expected Linux AppImage and Debian installers."
            exit 1
          fi
          if ! find "$assets" -maxdepth 1 -type f -iname '*-setup.exe' -print -quit | grep -q .; then
            echo "::error::Expected a Windows NSIS setup.exe installer."
            exit 1
          fi
          version="$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^desktop-v//')"
          bun packages/desktop-app/apps/examples/desktop-app/scripts/generate-update-manifest.ts \
            --version "$version" \
            --tag "$GITHUB_REF_NAME" \
            --dir "$assets" \
            --out "$RUNNER_TEMP/latest.json" \
            --repo "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="$(printf '%s' "$tag" | sed 's/^desktop-v//')"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --draft \
              --title "SynAI Desktop $version" \
              --notes "Installers for Windows, macOS (Apple Silicon and Intel), and Linux. See the assets below."
          fi
          gh release upload "$tag" "$RUNNER_TEMP/synai-desktop-release"/* "$RUNNER_TEMP/latest.json" --clobber
          gh release edit "$tag" --draft=false

      - name: Refresh desktop auto-update feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view desktop-latest >/dev/null 2>&1; then
            gh release upload desktop-latest "$RUNNER_TEMP/latest.json" --clobber
            gh release edit desktop-latest --prerelease
          else
            gh release create desktop-latest "$RUNNER_TEMP/latest.json" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "SynAI Desktop Update Feed" \
              --notes "Rolling updater manifest. Keep this release and tag available."
          fi
